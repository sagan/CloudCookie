name: Release

on:
  push:
    tags:
      - "v*"

permissions:
  contents: write

jobs:
  build-server:
    name: Build server (${{ matrix.target }})
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        target:
          - x86_64-unknown-linux-musl
          - aarch64-unknown-linux-musl
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Install Rust toolchain
        uses: dtolnay/rust-toolchain@stable
        with:
          targets: ${{ matrix.target }}

      - name: Setup musl cross toolchain
        uses: taiki-e/setup-cross-toolchain-action@v1
        with:
          target: ${{ matrix.target }}

      - name: Cache Cargo dependencies
        uses: Swatinem/rust-cache@v2
        with:
          workspaces: server

      - name: Build server binary
        run: |
          cargo build --release --manifest-path server/Cargo.toml --target ${{ matrix.target }}
          cp server/target/${{ matrix.target }}/release/cloudcookie-server cloudcookie-server-${{ matrix.target }}

      - name: Upload server binary
        uses: actions/upload-artifact@v4
        with:
          name: cloudcookie-server-${{ matrix.target }}
          path: cloudcookie-server-${{ matrix.target }}

  build-ext:
    name: Build browser extension
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: "24"
          cache: npm
          cache-dependency-path: ext/package-lock.json

      - name: Install dependencies and build
        working-directory: ext
        run: |
          npm ci
          npm run build

      - name: Package extension zip
        working-directory: ext/dist/chrome-mv3
        run: zip -r "${{ github.workspace }}/cloudcookie-ext.zip" .

      - name: Upload extension zip
        uses: actions/upload-artifact@v4
        with:
          name: cloudcookie-ext
          path: cloudcookie-ext.zip

  release:
    name: Publish GitHub Release
    needs:
      - build-server
      - build-ext
    runs-on: ubuntu-latest
    steps:
      - name: Download build artifacts
        uses: actions/download-artifact@v4
        with:
          path: artifacts
          merge-multiple: true

      - name: Create GitHub Release
        uses: softprops/action-gh-release@v2
        with:
          generate_release_notes: true
          files: |
            artifacts/cloudcookie-server-aarch64-unknown-linux-musl
            artifacts/cloudcookie-server-x86_64-unknown-linux-musl
            artifacts/cloudcookie-ext.zip
