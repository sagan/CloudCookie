name: Release

on:
  push:
    tags:
      - "v*"

permissions:
  contents: write
  packages: write

jobs:
  build-server:
    name: Build server (${{ matrix.target }})
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        target:
          - x86_64-unknown-linux-musl
          - aarch64-unknown-linux-musl
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Install Rust toolchain
        uses: dtolnay/rust-toolchain@stable
        with:
          targets: ${{ matrix.target }}

      - name: Setup musl cross toolchain
        uses: taiki-e/setup-cross-toolchain-action@v1
        with:
          target: ${{ matrix.target }}

      - name: Cache Cargo dependencies
        uses: Swatinem/rust-cache@v2
        with:
          workspaces: server

      - name: Build server binary
        run: |
          cargo build --release --manifest-path server/Cargo.toml --target ${{ matrix.target }}
          cp server/target/${{ matrix.target }}/release/cloudcookie-server cloudcookie-server-${{ matrix.target }}

      - name: Upload server binary
        uses: actions/upload-artifact@v4
        with:
          name: cloudcookie-server-${{ matrix.target }}
          path: cloudcookie-server-${{ matrix.target }}

  build-ext:
    name: Build browser extension
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: "24"
          cache: npm
          cache-dependency-path: ext/package-lock.json

      - name: Install dependencies and build
        working-directory: ext
        run: |
          npm ci
          npm run build

      - name: Package extension zip
        working-directory: ext/dist/chrome-mv3
        run: zip -r "${{ github.workspace }}/cloudcookie-ext.zip" .

      - name: Upload extension zip
        uses: actions/upload-artifact@v4
        with:
          name: cloudcookie-ext
          path: cloudcookie-ext.zip

  build-mcp:
    name: Build MCP server (${{ matrix.goos }}/${{ matrix.goarch }})
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        include:
          - goos: linux
            goarch: amd64
            ext: ""
          - goos: linux
            goarch: arm64
            ext: ""
          - goos: darwin
            goarch: amd64
            ext: ""
          - goos: darwin
            goarch: arm64
            ext: ""
          - goos: windows
            goarch: amd64
            ext: ".exe"
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Go
        uses: actions/setup-go@v5
        with:
          go-version-file: mcp/go.mod
          cache-dependency-path: mcp/go.mod

      - name: Test MCP server
        working-directory: mcp
        run: go test ./...

      - name: Build MCP binary
        working-directory: mcp
        env:
          CGO_ENABLED: "0"
          GOOS: ${{ matrix.goos }}
          GOARCH: ${{ matrix.goarch }}
        run: |
          go build -trimpath -ldflags="-s -w" -o "${{ github.workspace }}/cloudcookie-mcp-${{ matrix.goos }}-${{ matrix.goarch }}${{ matrix.ext }}" .

      - name: Upload MCP binary
        uses: actions/upload-artifact@v4
        with:
          name: cloudcookie-mcp-${{ matrix.goos }}-${{ matrix.goarch }}
          path: cloudcookie-mcp-${{ matrix.goos }}-${{ matrix.goarch }}${{ matrix.ext }}

  release:
    name: Publish GitHub Release
    needs:
      - build-server
      - build-ext
      - build-mcp
    runs-on: ubuntu-latest
    steps:
      - name: Download build artifacts
        uses: actions/download-artifact@v4
        with:
          path: artifacts
          merge-multiple: true

      - name: Create GitHub Release
        uses: softprops/action-gh-release@v2
        with:
          generate_release_notes: true
          files: |
            artifacts/cloudcookie-server-aarch64-unknown-linux-musl
            artifacts/cloudcookie-server-x86_64-unknown-linux-musl
            artifacts/cloudcookie-ext.zip
            artifacts/cloudcookie-mcp-linux-amd64
            artifacts/cloudcookie-mcp-linux-arm64
            artifacts/cloudcookie-mcp-darwin-amd64
            artifacts/cloudcookie-mcp-darwin-arm64
            artifacts/cloudcookie-mcp-windows-amd64.exe

  build-docker:
    name: Build and push Docker image
    needs:
      - build-server
    runs-on: ubuntu-latest
    steps:
      - name: Download x86_64 server binary
        uses: actions/download-artifact@v4
        with:
          name: cloudcookie-server-x86_64-unknown-linux-musl
          path: dist/linux/amd64

      - name: Download aarch64 server binary
        uses: actions/download-artifact@v4
        with:
          name: cloudcookie-server-aarch64-unknown-linux-musl
          path: dist/linux/arm64

      - name: Prepare binaries and Dockerfile
        run: |
          mv dist/linux/amd64/cloudcookie-server-x86_64-unknown-linux-musl dist/linux/amd64/cloudcookie-server
          mv dist/linux/arm64/cloudcookie-server-aarch64-unknown-linux-musl dist/linux/arm64/cloudcookie-server
          chmod +x dist/linux/amd64/cloudcookie-server dist/linux/arm64/cloudcookie-server
          cat <<'EOF' > Dockerfile.release
          FROM alpine:3.24
          ARG TARGETARCH
          RUN apk add --no-cache ca-certificates \
              && mkdir -p /var/lib/cloudcookie
          COPY dist/linux/${TARGETARCH}/cloudcookie-server /usr/local/bin/cloudcookie-server
          ENV CLOUDCOOKIE_LISTEN=0.0.0.0:6767 \
              CLOUDCOOKIE_DATA_DIR=/var/lib/cloudcookie
          EXPOSE 6767
          VOLUME ["/var/lib/cloudcookie"]
          ENTRYPOINT ["/usr/local/bin/cloudcookie-server"]
          EOF

      - name: Set up QEMU
        uses: docker/setup-qemu-action@v3

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3

      - name: Log in to GitHub Container Registry
        uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Extract Docker metadata
        id: meta
        uses: docker/metadata-action@v5
        with:
          images: ghcr.io/${{ github.repository }}
          tags: |
            type=semver,pattern={{version}}
            type=semver,pattern={{major}}.{{minor}}
            type=semver,pattern={{major}}

      - name: Build and push Docker image
        uses: docker/build-push-action@v6
        with:
          context: .
          file: Dockerfile.release
          platforms: linux/amd64,linux/arm64
          push: true
          tags: ${{ steps.meta.outputs.tags }}
          labels: ${{ steps.meta.outputs.labels }}

  build-mcp-docker:
    name: Build and push MCP Docker image
    needs:
      - build-mcp
    runs-on: ubuntu-latest
    steps:
      - name: Download linux/amd64 MCP binary
        uses: actions/download-artifact@v4
        with:
          name: cloudcookie-mcp-linux-amd64
          path: dist-mcp/linux/amd64

      - name: Download linux/arm64 MCP binary
        uses: actions/download-artifact@v4
        with:
          name: cloudcookie-mcp-linux-arm64
          path: dist-mcp/linux/arm64

      - name: Prepare MCP binaries and Dockerfile
        run: |
          mv dist-mcp/linux/amd64/cloudcookie-mcp-linux-amd64 dist-mcp/linux/amd64/cloudcookie-mcp
          mv dist-mcp/linux/arm64/cloudcookie-mcp-linux-arm64 dist-mcp/linux/arm64/cloudcookie-mcp
          chmod +x dist-mcp/linux/amd64/cloudcookie-mcp dist-mcp/linux/arm64/cloudcookie-mcp
          cat <<'EOF' > Dockerfile.mcp.release
          FROM alpine:3.24
          ARG TARGETARCH
          RUN apk add --no-cache ca-certificates
          COPY dist-mcp/linux/${TARGETARCH}/cloudcookie-mcp /usr/local/bin/cloudcookie-mcp
          ENV CLOUDCOOKIE_MCP_TRANSPORT=http \
              CLOUDCOOKIE_MCP_LISTEN=0.0.0.0:6777
          EXPOSE 6777
          ENTRYPOINT ["/usr/local/bin/cloudcookie-mcp"]
          EOF

      - name: Set up QEMU
        uses: docker/setup-qemu-action@v3

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3

      - name: Log in to GitHub Container Registry
        uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Extract MCP Docker metadata
        id: meta
        uses: docker/metadata-action@v5
        with:
          images: ghcr.io/${{ github.repository }}-mcp
          tags: |
            type=semver,pattern={{version}}
            type=semver,pattern={{major}}.{{minor}}
            type=semver,pattern={{major}}

      - name: Build and push MCP Docker image
        uses: docker/build-push-action@v6
        with:
          context: .
          file: Dockerfile.mcp.release
          platforms: linux/amd64,linux/arm64
          push: true
          tags: ${{ steps.meta.outputs.tags }}
          labels: ${{ steps.meta.outputs.labels }}
